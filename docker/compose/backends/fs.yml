services:
  test-container:
    environment:
      GOO_BACKEND_NAME: '4store'
      GOO_HOST: 4store-ut
      GOO_PORT: 9000
      GOO_PATH_QUERY: /sparql/
      GOO_PATH_DATA: /data/
      GOO_PATH_UPDATE: /update/
    depends_on:
      solr-ut:
        condition: service_healthy
      redis-ut:
        condition: service_healthy
      4store-ut:
        condition: service_healthy
